version: "3.8"

# ─────────────────────────────────────────────────────────────────────────
# Stack 100% local — esta máquina actúa como servidor.
# Todo corre en contenedores locales; no depende de ningún servicio cloud.
# Cuando exista presupuesto de nube, solo hay que:
#   1) apuntar POSTGRES_HOST a la instancia cloud (ej. Azure Database for
#      PostgreSQL) en lugar del contenedor "postgres"
#   2) desactivar USE_DEMO_DATA=false en airflow y cargar credenciales
#      reales de Fracttal API (client_id/secret) como Airflow Connection.
# El resto del pipeline (DAGs, transform, esquema, Power BI, webapp) no cambia.
# ─────────────────────────────────────────────────────────────────────────

x-airflow-common: &airflow-common
  image: apache/airflow:2.9.3-python3.11
  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@postgres_airflow:5432/airflow
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__WEBSERVER__EXPOSE_CONFIG: "true"
    AIRFLOW__CORE__DEFAULT_TIMEZONE: America/Lima
    PYTHONPATH: /opt/airflow   # necesario para que `from transform...` y `from connectors...` se puedan importar
    CMMS_USE_DEMO_DATA: "true"
    CMMS_DW_HOST: postgres_dw
    CMMS_DW_PORT: "5432"
    CMMS_DW_NAME: cmms_dw
    CMMS_DW_USER: cmms_admin
    CMMS_DW_PASSWORD: cmms_local_pw_change_me
    FRACTTAL_API_BASE_URL: https://api.fracttal.com
    FRACTTAL_TOKEN_URL: https://one.fracttal.com/oauth/token
    # Motor ETL genérico (ver docs/ARQUITECTURA_ETL.md) — fuentes de ejemplo,
    # 100% locales/gratis, para demostrar conectores más allá de Fracttal.
    ERP_MYSQL_URL: mysql+pymysql://erp_demo:erp_demo_pw@mysql_demo:3306/erp_demo?charset=utf8mb4
    MOCK_JSONRPC_BASE_URL: http://mock_jsonrpc:5099
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./transform:/opt/airflow/transform
    - ./connectors:/opt/airflow/connectors
    - ./import:/opt/airflow/import
    - airflow_logs:/opt/airflow/logs
  depends_on:
    postgres_airflow:
      condition: service_healthy
    postgres_dw:
      condition: service_healthy
    mysql_demo:
      condition: service_healthy
    mock_jsonrpc:
      condition: service_healthy

services:
  postgres_airflow:
    image: postgres:16
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - pg_airflow_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "airflow"]
      interval: 5s
      retries: 5
    ports:
      - "5433:5432"
    restart: unless-stopped

  postgres_dw:
    image: postgres:16
    environment:
      POSTGRES_USER: cmms_admin
      POSTGRES_PASSWORD: cmms_local_pw_change_me
      POSTGRES_DB: cmms_dw
    volumes:
      - pg_dw_data:/var/lib/postgresql/data
      - ./sql/schema:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "cmms_admin"]
      interval: 5s
      retries: 5
    ports:
      - "5432:5432"
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/connectors/requirements.txt
        echo "Validando configs del motor ETL..."
        python -m connectors.config_validator
        airflow db migrate
        airflow users create \
          --username admin --password admin \
          --firstname Admin --lastname CMMS \
          --role Admin --email admin@example.local
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    # airflow-init instala connectors/requirements.txt en SU PROPIO
    # contenedor (no se comparte filesystem con este) — sin este mismo
    # `pip install` acá, este contenedor nunca tiene json-logic-qubit,
    # sqlalchemy, etc. y los DAGs fallan al importar transform/connectors.
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/connectors/requirements.txt
        exec airflow webserver
    ports:
      - "8080:8080"
    depends_on:
      - airflow-init
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    entrypoint: /bin/bash
    command:
      - -c
      - |
        pip install --no-cache-dir -r /opt/airflow/connectors/requirements.txt
        exec airflow scheduler
    depends_on:
      - airflow-init
    restart: unless-stopped

  adminer:
    image: adminer:latest
    ports:
      - "8081:8080"
    restart: unless-stopped

  # ── Motor ETL genérico — fuentes de ejemplo 100% locales/gratis ──────
  # Simula un ERP externo (MySQL) de otra sede, para demostrar que
  # connectors/sql_connector.py migra datos de un motor DISTINTO al
  # Postgres del CMMS sin escribir código nuevo (ver docs/ARQUITECTURA_ETL.md).
  mysql_demo:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: root_demo_pw
      MYSQL_DATABASE: erp_demo
      MYSQL_USER: erp_demo
      MYSQL_PASSWORD: erp_demo_pw
    volumes:
      - mysql_demo_data:/var/lib/mysql
      - ./connectors/mysql_demo_init:/docker-entrypoint-initdb.d/
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "erp_demo", "-perp_demo_pw"]
      interval: 5s
      retries: 10
      start_period: 20s
    ports:
      - "3307:3306"
    restart: unless-stopped

  # Servidor JSON-RPC 2.0 local — demuestra connectors/api_connector.py
  # hablando el protocolo real, sin depender de ninguna API paga.
  mock_jsonrpc:
    image: python:3.11-slim
    working_dir: /app
    command: sh -c "pip install --no-cache-dir -r requirements.txt && python app.py"
    volumes:
      - ./connectors/mock_jsonrpc_server:/app
    ports:
      - "5099:5099"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5099/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  webapp:
    image: python:3.11-slim
    working_dir: /app
    command: >
      sh -c "pip install --no-cache-dir -r requirements.txt &&
             python scripts/seed_demo_users.py &&
             python app.py"
    environment:
      CMMS_DW_HOST: postgres_dw
      CMMS_DW_PORT: "5432"
      CMMS_DW_NAME: cmms_dw
      CMMS_DW_USER: cmms_admin
      CMMS_DW_PASSWORD: cmms_local_pw_change_me
      PORT: "5090"
      FLASK_DEBUG: "false"
      CMMS_API_KEY: cmms-local-dev-key
      CMMS_SECRET_KEY: dev-secret-key-CHANGE-EN-PRODUCCION   # firma las cookies de sesión — CAMBIAR
    volumes:
      - ./webapp:/app
      - ./scripts:/app/scripts
    ports:
      - "5090:5090"
    depends_on:
      postgres_dw:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:5090/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

volumes:
  pg_airflow_data:
  pg_dw_data:
  airflow_logs:
  mysql_demo_data:
